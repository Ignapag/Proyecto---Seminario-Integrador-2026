name: CI

# Corre en cada push a main y en cada Pull Request.
# Si algo falla, el PR muestra la cruz roja antes de que alguien lo mergee.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend y base de datos
    runs-on: ubuntu-latest

    # PostgreSQL descartable, solo para esta corrida.
    # NO se usa la base compartida del grupo: asi las pruebas no pueden
    # ensuciarla ni romperla, y no hace falta guardar sus credenciales aca.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monu
          POSTGRES_PASSWORD: monu
          POSTGRES_DB: monuburger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monu -d monuburger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://monu:monu@localhost:5432/monuburger
      ENTORNO: ci

    defaults:
      run:
        working-directory: App/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Estilo del codigo (ruff)
        run: ruff check .

      # El paso clave: prueba que las migraciones aplican sobre una base
      # VACIA. Es el escenario de quien clona el repo por primera vez, y
      # donde aparecen los errores que en una base ya migrada no se ven.
      - name: Aplicar migraciones desde cero
        run: python -m scripts.migrate --seed

      - name: Verificar que no queden migraciones pendientes
        run: python -m scripts.migrate --status

      - name: Pruebas
        run: pytest -q

      # La documentacion del esquema se genera del SQL. Si alguien agrega una
      # migracion y no la regenera, el diagrama y el diccionario quedan
      # mintiendo, asi que se verifica que esten al dia.
      - name: Documentacion del esquema al dia
        run: |
          python -m scripts.diccionario
          python -m scripts.der
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code --stat docs/; then
            echo "::error::La documentacion del esquema quedo desactualizada."
            echo "Corre en App/backend: python -m scripts.diccionario && python -m scripts.der"
            exit 1
          fi
